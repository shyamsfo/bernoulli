[project]
name = "bernoulli"
version = "0.0.1"
description = "Calibrated multimodal decision model: text + images + typed questions → probabilities."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "DeepStore", email = "shyam@deepstore.ai" }]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
# M2+: HF scorer path
scorer-hf = [
    "torch>=2.4",
    "torchvision",
    "transformers>=4.46",
    "accelerate>=1.0",
    "pillow>=10.4",
]
# M3+: eval + calibration
eval = [
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "datasets>=3.0",
]
# M4+: vLLM serving
serve = [
    "vllm>=0.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# M5+: LoRA
train = [
    "peft>=0.13",
    "trl>=0.11",
]

[project.scripts]
bernoulli = "bernoulli.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    # scorer-hf deps: duplicated here so `uv sync` on the dev box gets a
    # ready-to-run environment. Library consumers install via `bernoulli[scorer-hf]`.
    "torch>=2.4",
    "torchvision",
    "transformers>=4.46",
    "accelerate>=1.0",
    "pillow>=10.4",
    # eval deps (M3+)
    "datasets>=3.0",
    "scipy>=1.13",
    # serve deps (M4+)
    "vllm>=0.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

# Pull CUDA-enabled torch wheels on linux. CPU torch everywhere else.
# torchvision is pinned too because transformers imports it at import time, and
# a mismatched CUDA version between torch and torchvision bombs the whole stack.
[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bernoulli", "evals", "benchmarks"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["product", "deploy", "evals/reports"]

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pycodestyle + pyflakes
    "I",               # isort
    "B",               # bugbear
    "UP",              # pyupgrade
    "N",               # pep8-naming
    "RUF",             # ruff-specific
    "SIM",             # flake8-simplify
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["^product/", "^deploy/", "^evals/reports/"]

[[tool.mypy.overrides]]
module = ["transformers.*", "vllm.*", "datasets.*", "peft.*", "trl.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "gpu: requires a CUDA-capable GPU (skip when unavailable)",
    "slow: slow tests (skip in quick-ci)",
]
